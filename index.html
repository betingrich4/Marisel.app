<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }
        
        header {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            font-size: 28px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 30px;
            background: #282828;
            color: #fff;
            font-size: 16px;
        }
        
        .search-box button {
            padding: 12px 20px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .player-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .now-playing {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .song-info {
            flex: 1;
        }
        
        .song-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .song-artist {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            color: #ff0000;
        }
        
        .play-pause {
            font-size: 40px;
            background: #ff0000;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .playlist {
            margin-top: 40px;
        }
        
        .playlist-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .song-card {
            background: #282828;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .song-card:hover {
            background: #383838;
            transform: translateY(-5px);
        }
        
        .song-card-img {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
            aspect-ratio: 1/1;
            object-fit: cover;
        }
        
        .song-card-title {
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .song-card-artist {
            font-size: 14px;
            color: #aaa;
        }
        
        @media (max-width: 768px) {
            .now-playing {
                flex-direction: column;
                text-align: center;
            }
            
            .album-art {
                width: 200px;
                height: 200px;
            }
            
            .controls {
                gap: 15px;
            }
            
            .play-pause {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-youtube"></i>
                <span>Cloud Music</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for songs...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </header>
        
        <div class="player-container">
            <div class="now-playing">
                <img src="https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" alt="Album Art" class="album-art" id="albumArt">
                <div class="song-info">
                    <h1 class="song-title" id="songTitle">Not Playing</h1>
                    <p class="song-artist" id="songArtist">Search for a song to begin</p>
                    
                    <div class="player-controls">
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="time-info">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                        <div class="controls">
                            <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                            <button class="control-btn play-pause" id="playPauseBtn"><i class="fas fa-play"></i></button>
                            <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="playlist">
                <h2 class="playlist-title">Search Results</h2>
                <div class="song-list" id="songList">
                    <!-- Songs will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const albumArt = document.getElementById('albumArt');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songList = document.getElementById('songList');
        
        // Audio element
        const audio = new Audio();
        let isPlaying = false;
        let currentSongIndex = 0;
        let songs = [];
        
        // Format time (seconds to MM:SS)
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // Update progress bar
        function updateProgress() {
            const { currentTime, duration } = audio;
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
        }
        
        // Set progress when clicked on progress bar
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }
        
        // Play song
        function playSong() {
            audio.play();
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }
        
        // Pause song
        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
        
        // Load and play song
        function loadSong(song) {
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            albumArt.src = song.thumbnail;
            audio.src = song.audioUrl;
            
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });
            
            playSong();
        }
        
        // Previous song
        function prevSong() {
            currentSongIndex--;
            if (currentSongIndex < 0) {
                currentSongIndex = songs.length - 1;
            }
            loadSong(songs[currentSongIndex]);
        }
        
        // Next song
        function nextSong() {
            currentSongIndex++;
            if (currentSongIndex > songs.length - 1) {
                currentSongIndex = 0;
            }
            loadSong(songs[currentSongIndex]);
        }
        
        // Search for songs
        async function searchSongs(query) {
            try {
                // In a real app, you would call the YouTube API here
                // For demo purposes, we'll simulate search results
                
                // Simulate API call delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Mock data - in a real app, you would get this from YouTube API
                songs = [
                    {
                        title: "Yatapita",
                        artist: "Diamond Platnumz",
                        thumbnail: "https://i.ytimg.com/vi/VIDEO_ID_1/maxresdefault.jpg",
                        audioUrl: "https://www.youtube.com/watch?v=VIDEO_ID_1"
                    },
                    {
                        title: "La La La",
                        artist: "Yo Yo Honey Singh",
                        thumbnail: "https://i.ytimg.com/vi/VIDEO_ID_2/maxresdefault.jpg",
                        audioUrl: "https://www.youtube.com/watch?v=VIDEO_ID_2"
                    },
                    {
                        title: "Shape of You",
                        artist: "Ed Sheeran",
                        thumbnail: "https://i.ytimg.com/vi/VIDEO_ID_3/maxresdefault.jpg",
                        audioUrl: "https://www.youtube.com/watch?v=VIDEO_ID_3"
                    },
                    {
                        title: "Blinding Lights",
                        artist: "The Weeknd",
                        thumbnail: "https://i.ytimg.com/vi/VIDEO_ID_4/maxresdefault.jpg",
                        audioUrl: "https://www.youtube.com/watch?v=VIDEO_ID_4"
                    }
                ];
                
                // Update the song list in the UI
                updateSongList();
                
                // Load the first song
                if (songs.length > 0) {
                    currentSongIndex = 0;
                    loadSong(songs[0]);
                }
            } catch (error) {
                console.error('Error searching songs:', error);
                alert('Failed to search for songs. Please try again.');
            }
        }
        
        // Update the song list UI
        function updateSongList() {
            songList.innerHTML = '';
            
            songs.forEach((song, index) => {
                const songCard = document.createElement('div');
                songCard.className = 'song-card';
                songCard.innerHTML = `
                    <img src="${song.thumbnail}" alt="${song.title}" class="song-card-img">
                    <h3 class="song-card-title">${song.title}</h3>
                    <p class="song-card-artist">${song.artist}</p>
                `;
                
                songCard.addEventListener('click', () => {
                    currentSongIndex = index;
                    loadSong(song);
                });
                
                songList.appendChild(songCard);
            });
        }
        
        // Event listeners
        playPauseBtn.addEventListener('click', () => {
            isPlaying ? pauseSong() : playSong();
        });
        
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', nextSong);
        
        progressContainer.addEventListener('click', setProgress);
        
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) {
                searchSongs(query);
            }
        });
        
        // Initialize with some songs
        searchSongs('popular songs');
    </script>
</body>
</html>
